services:
  app:
    build:
      context: ./docker/php
    container_name: notehub-app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html:cached
    environment:
      PHP_IDE_CONFIG: "serverName=notehub"
    depends_on:
      - db
      - redis


  nginx:
    image: nginx:1.25-alpine
    container_name: notehub-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app


  db:
    image: postgres:16-alpine
    container_name: notehub-db
    environment:
      POSTGRES_DB: notehub
      POSTGRES_USER: notehub
      POSTGRES_PASSWORD: notehub
    ports:
    - "5432:5432"
    volumes:
      - notehub-pgdata:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: notehub-redis
    ports:
    - "63790:6379"


  mailhog:
    image: mailhog/mailhog:latest
    container_name: notehub-mailhog
    ports:
    - "8025:8025"


volumes:
  notehub-pgdata: